; 按名字屏蔽"静态工具不可见对象"的 unqualified 警告(官方机制,见
; qtqml-tooling-qmllint.html#context-property-settings)。
; 这四个 singleton 经 qmlRegisterSingletonInstance 运行时注册(src/main.cpp),
; 无编译期 qmltypes 元数据,qmllint/QML Language Server 不认识;
; 运行时解析完全正常,此处仅消除 IDE 噪音,不改变任何行为。
[General]
disableUnqualifiedAccess = "EmbyClient,AccountManager,ColorProvider,ConfigManager"
warnOnUsage = ""
disableHeuristic = false
