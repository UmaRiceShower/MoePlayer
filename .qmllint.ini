; qmllint / QML Language Server 配置(官方格式,见 qtqml-tooling-qmllint.html)。
; 运行时注册的 singleton(EmbyClient/AccountManager/ColorProvider,见 src/main.cpp
; qmlRegisterSingletonInstance)对静态工具不可见,产生 [unqualified] 噪音;
; 精准屏蔽见同目录 .contextProperties.ini。此处保持 UnqualifiedAccess=warning,
; 避免掩盖真正"漏写 id 限定"的问题。
[General]
MaxWarnings=-1

[Warnings]
UnqualifiedAccess=warning
