name: flatpak

on:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 flatpak 与 KDE runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Sdk//6.10 org.kde.Platform//6.10

      - name: 构建 Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-flatpak \
            packaging/flatpak/io.github.umariceshower.MoePlayer.yml
          flatpak build-bundle repo MoePlayer.flatpak io.github.umariceshower.MoePlayer

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: MoePlayer.flatpak
          if-no-files-found: error
