name: build

on:
  # 发布 = 打 tag(v0.2.0 / v0.2.0-rc.1):tag 触发四平台构建 + 建 GitHub
  # Release(tag 含 '-' 自动标 pre-release)。workflow_dispatch 保留供
  # 手动验证(产物带 -dev 后缀)。
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 版本解析(tag 优先,校验与 project(VERSION) 数字段一致):四个打包
  # 作业经 needs 取 version/vnum/suffix,suffix 以环境变量注入 CMake 与
  # AppImage 脚本。
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      vnum: ${{ steps.ver.outputs.vnum }}
      suffix: ${{ steps.ver.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: |
          proj=$(sed -n 's/^project(MoePlayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          suffix=$(sed -n 's/^set(MOEPLAYER_VERSION_SUFFIX "\([^"]*\)")/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            if [[ "$v" != "$proj" && "$v" != "$proj"-* ]]; then
              echo "::error::tag $v 与 project(VERSION) $proj 不一致(数字段必须相等)"
              exit 1
            fi
            suffix="${v#$proj}"   # v0.2.0 → "";v0.2.0-rc.1 → "-rc.1"
          fi
          echo "version=${proj}${suffix}" >> "$GITHUB_OUTPUT"
          echo "vnum=$proj" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${proj}${suffix}"

  appimage:
    needs: version
    runs-on: ubuntu-22.04
    env:
      MOEPLAYER_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools qtwebsockets'
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxrender-dev libxi-dev libxcomposite-dev libxdamage-dev libmpv2 \
            libxext-dev libxfixes-dev libxrandr-dev libxcb1-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-randr0-dev \
            libxcb-sync-dev libxcb-shm0-dev libxcb-glx0-dev libxcb-util-dev libxcb-image0-dev

      - name: 构建 AppImage
        run: ./packaging/build-appimage.sh dist

      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      MOEPLAYER_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools qtwebsockets'
          cache: true

      # 不写 -G:VS 生成器名随版本变(windows-latest 自 2026-06 起是 VS 2026
      # 镜像,已无 VS 2022 实例),让 CMake 自选最新 VS 生成器(镜像 CMake ≥4.2
      # 支持 VS 18 2026)。多配置生成器,产物在 build\Release\。Qt 的 msvc2022
      # 构建与 VS 2026 工具集 ABI 兼容(MSVC 2015+ 稳定 ABI)。
      - name: 构建
        run: |
          cmake -B build -A x64
          cmake --build build --config Release --parallel

      - name: windeployqt 收集运行时
        # --qmldir:扫 QML import 决定要带哪些 Qt Quick 模块(应用自身的
        # MoePlayer.Core 已编进 exe,扫描器找不到只报无害警告)。
        # --no-compiler-runtime:安装版走微软官方 vc_redist 安装器(NSIS 里
        # 静默执行,系统级 + Windows Update 维护);便携版另行 app-local
        # 散装 CRT DLL(两种都是微软文档允许的再分发形式)。
        # --no-translations:应用自带中文文案,不带 Qt 翻译。
        # --no-opengl-sw:剔除 opengl32sw.dll(约 20MB 的软件 OpenGL 回退渲染,
        # 仅 RHI 走 OpenGL 后端才加载;Windows 默认 D3D11,永远用不上)。
        run: |
          windeployqt --qmldir qml --release --no-compiler-runtime --no-translations --no-opengl-sw --dir package "build\Release\MoePlayer.exe"
          Copy-Item "build\Release\MoePlayer.exe" package\
          Copy-Item -Recurse "resources\lua" "package\lua"
          Copy-Item -Recurse "resources\shaders" "package\shaders"
          Copy-Item "LICENSE","THIRD-PARTY-NOTICES.md" package\

      - name: 拉取 libmpv(shinchiro 官方完整版)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          # 日期段以数字开头:排除 x86_64-v3 变体(pre-Haswell CPU 会非法指令崩)
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-[0-9].*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "shinchiro 最新 release 没有 mpv-dev-x86_64 资产" }
          Write-Host "来源: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "压缩包里没有 libmpv-2.dll" }
          $size = $dll.Length
          if ($size -lt 60MB) { throw "libmpv-2.dll 只有 $size 字节,不是完整版" }
          Copy-Item $dll.FullName "package\libmpv-2.dll"
          Write-Host "libmpv-2.dll $([math]::Round($size/1MB,1))MB 已进 package"

      - name: 下载 VC++ 运行库安装器
        # aka.ms/vc14 = 官方"最新 v14 运行库"永链(VS 2017–2026 同一家族,
        # 实测重定向到 vs/18 的最新包),镜像换代也不用跟改。
        run: curl.exe -L --fail -o vc_redist.x64.exe https://aka.ms/vc14/vc_redist.x64.exe

      # windows-2025-vs2026 镜像不再预装 NSIS(旧镜像有),装一份用于打包。
      # choco/nsis.install 改的是"机器 PATH"且不建 shim —— 对本作业已启动的
      # 进程不可见,须写入 GITHUB_PATH 让后续步骤拿到;目录从机器 PATH 动态
      # 取(含 makensis.exe 的那条),不写死安装路径。
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $nsisDir = ($machinePath -split ';' |
                      Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
                      Select-Object -First 1)
          if (-not $nsisDir) { $nsisDir = 'C:\Program Files (x86)\NSIS' }
          Add-Content $env:GITHUB_PATH $nsisDir
          Write-Host "makensis 目录: $nsisDir"

      - name: NSIS 打包
        # VERSION = 完整串(文件名/字符串字段,如 0.2.0-rc.1);
        # VERSION_NUM = 纯数字(VIProductVersion 只收四段数)。
        shell: pwsh
        run: makensis /DVERSION=${{ needs.version.outputs.version }} /DVERSION_NUM=${{ needs.version.outputs.vnum }} packaging/windows-installer.nsi

      - name: 打包便携版 zip
        # 免安装版:同一 package/ 树 + 便携标记 + CRT DLL app-local 散装
        # (免安装版不能要求管理员跑 vc_redist 安装器)。在 makensis 之后
        # 执行,标记与 CRT DLL 不会混进安装器(安装版机制保持不变)。
        shell: pwsh
        run: |
          # CRT DLL(msvcp140/vcruntime140 等):从 VS 安装的 Redist 目录取
          # (vswhere 定位;Microsoft.VC*.CRT 通配兼容各 VS 版本号)。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                 Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "未找到 VC++ Redist CRT 目录($vs\VC\Redist\MSVC)" }
          Copy-Item "$($crt.FullName)\*.dll" package\
          # 便携标记:存在即启用便携模式(数据存 exe 旁 data/,见 apppaths.h)。
          New-Item -ItemType File -Path package\portable_mode.txt | Out-Null
          Compress-Archive -Path package\* -DestinationPath "MoePlayer-Portable-${{ needs.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: MoePlayer-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: MoePlayer-Portable-*.zip
          if-no-files-found: error

  deb:
    needs: version
    runs-on: ubuntu-22.04
    container: debian:trixie
    env:
      MOEPLAYER_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - name: 安装依赖
        run: |
          apt-get update
          # ca-certificates:debian 基础镜像不带它,而 --no-install-recommends 下
          # git 只会 Recommends 它 ⇒ 容器内 checkout 会报 SSL CA cert 错误。
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ \
            dpkg-dev file qt6-base-dev qt6-declarative-dev qt6-websockets-dev qt6-shadertools-dev

      - uses: actions/checkout@v5

      - name: 构建 DEB
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          cd build && cpack -G DEB

      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  rpm:
    needs: version
    runs-on: ubuntu-22.04
    container: fedora:42
    env:
      MOEPLAYER_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - name: 安装依赖
        run: |
          dnf install -y git cmake ninja-build gcc-c++ rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwebsockets-devel qt6-qtshadertools-devel

      - uses: actions/checkout@v5

      - name: 构建 RPM
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          cd build && cpack -G RPM

      - uses: actions/upload-artifact@v6
        with:
          name: rpm
          path: build/*.rpm
          if-no-files-found: error

  flatpak:
    needs: version
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    env:
      MOEPLAYER_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5

      - name: 构建 Flatpak
        run: |
          git config --global protocol.file.allow always
          sed -i 's/^set(MOEPLAYER_VERSION_SUFFIX "[^"]*")/set(MOEPLAYER_VERSION_SUFFIX "'"$MOEPLAYER_VERSION_SUFFIX"'")/' CMakeLists.txt
          grep 'MOEPLAYER_VERSION_SUFFIX "' CMakeLists.txt
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo \
            build-flatpak packaging/flatpak/io.github.umariceshower.MoePlayer.yml
          flatpak build-bundle repo "MoePlayer-${{ needs.version.outputs.version }}-x86_64.flatpak" \
            io.github.umariceshower.MoePlayer

      - uses: actions/upload-artifact@v6
        with:
          name: flatpak
          path: MoePlayer-*.flatpak
          if-no-files-found: error

  # tag 构建收尾:汇总五平台产物建 GitHub Release(tag 含 '-' = 预发布)。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, appimage, windows, deb, rpm, flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MoePlayer ${{ needs.version.outputs.version }}" \
            --generate-notes $pre
